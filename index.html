<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#090909">
<title>Nina Klishevich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&display=swap">
<style>

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html { background: #090909; }

body {
  min-height: 100vh;
  background: #090909;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  font-family: 'Cormorant Garamond', Georgia, serif;
  -webkit-font-smoothing: antialiased;
}

.card {
  width: 100%;
  max-width: 420px;
  min-height: 100vh;
  padding: 32px 44px 32px 44px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Hero */
.initials {
  font-size: 108px;
  font-weight: 600;
  letter-spacing: 0.14em;
  color: #ffffff;
  line-height: 1;
  margin-bottom: 12px;
}

.gold-rule {
  width: 44px;
  height: 1px;
  background: #C9A96E;
  margin-bottom: 14px;
}

.name {
  font-size: clamp(18px, calc(7.9vw - 7px), 26px);
  font-weight: 500;
  letter-spacing: 0.22em;
  white-space: nowrap;
  text-transform: uppercase;
  color: #ffffff;
  text-align: center;
  line-height: 1.2;
  margin-bottom: 8px;
}

.title {
  font-size: 22px;
  font-weight: 400;
  font-style: italic;
  color: #C9A96E;
  text-align: center;
  letter-spacing: 0.04em;
  line-height: 1.5;
  margin-bottom: 6px;
}

.tagline {
  font-size: 22px;
  font-weight: 300;
  color: rgba(201, 169, 110, 0.72);
  text-align: center;
  letter-spacing: 0.1em;
  line-height: 1.5;
}

/* Divider */
.rule {
  width: 100%;
  height: 1px;
  background: rgba(255, 255, 255, 0.07);
  margin: 18px 0;
}

/* Contacts */
.contacts {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.contact-link {
  display: flex;
  align-items: center;
  gap: 16px;
  text-decoration: none;
  color: rgba(255, 255, 255, 0.55);
  font-size: 20px;
  font-weight: 300;
  letter-spacing: 0.03em;
  font-family: 'Cormorant Garamond', Georgia, serif;
  transition: color 0.22s ease;
  line-height: 1.3;
}

.contact-link:hover,
.contact-link:active { color: #C9A96E; }

.icon {
  width: 17px;
  height: 17px;
  flex-shrink: 0;
  color: #ffffff;
  opacity: 0.5;
  transition: opacity 0.22s ease;
}

.contact-link:hover .icon,
.contact-link:active .icon { opacity: 1; }

/* QR */
.qr-section {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: 100%;
}

.qr-wrap {
  background: #ffffff;
  padding: 10px;
  display: inline-block;
  line-height: 0;
}

.qr-wrap img {
  display: block;
  width: 96px;
  height: 96px;
}

.qr-label {
  font-size: 11px;
  font-weight: 300;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.55);
}

/* Save */
.save-btn {
  margin-top: 20px;
  width: 100%;
  padding: 15px 24px;
  background: transparent;
  border: 1px solid rgba(201, 169, 110, 0.5);
  color: #C9A96E;
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 17px;
  font-weight: 400;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.22s ease;
  text-align: center;
  text-decoration: none;
  display: block;
}

.save-btn:hover,
.save-btn:active {
  background: #C9A96E;
  color: #090909;
  border-color: #C9A96E;
}
</style>
</head>

<script>
(function(){
  var b=document.getElementById('shareBtn');
  if(!b||!navigator.share)return;           // desktop / no share API: plain .vcf download (opens Add Contact)
  b.addEventListener('click',function(e){
    e.preventDefault();
    fetch('contact.vcf').then(function(r){return r.blob();}).then(function(blob){
      var file=new File([blob],'nina-klishevich.vcf',{type:'text/vcard'});
      var d={files:[file],title:'Nina Klishevich',text:'Nina Klishevich - Executive Advisor'};
      if(navigator.canShare&&navigator.canShare(d))return navigator.share(d);   // share the contact file
      return navigator.share({title:'Nina Klishevich',text:'Nina Klishevich - Executive Advisor',url:location.href}); // else share the card link
    }).catch(function(err){
      if(err&&err.name==='AbortError')return; // user cancelled
      location.href='contact.vcf';            // fallback
    });
  });
})();
</script>
