<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#565656">
<title>Nina Klishevich</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&display=swap');

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html { background: #565656; }

body {
  min-height: 100vh;
  background: #565656;
  display: flex;
  justify-content: center;
  font-family: 'Cormorant Garamond', Georgia, serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.card {
  width: 100%;
  max-width: 420px;
  min-height: 100vh;
  border-left: 2px solid #C9A96E;
  padding: 64px 44px 60px 44px;
  display: flex;
  flex-direction: column;
}

/* Header */
.header {
  padding-bottom: 38px;
  border-bottom: 1px solid rgba(201, 169, 110, 0.14);
  margin-bottom: 38px;
}

.name {
  font-size: 46px;
  font-weight: 500;
  letter-spacing: -0.01em;
  line-height: 1.04;
  color: #FFFFFF;
  margin-bottom: 18px;
}

.title {
  font-size: 16px;
  font-weight: 300;
  font-style: italic;
  color: #C9A96E;
  letter-spacing: 0.04em;
  line-height: 1.4;
  margin-bottom: 12px;
}

.tagline {
  font-size: 13px;
  font-weight: 300;
  color: rgba(255, 255, 255, 0.88);
  letter-spacing: 0.03em;
  line-height: 1.7;
}

/* Contacts */
.contacts {
  display: flex;
  flex-direction: column;
  gap: 22px;
  margin-bottom: 40px;
}

.contact-link {
  display: flex;
  align-items: center;
  gap: 15px;
  text-decoration: none;
  color: rgba(255, 255, 255, 0.90);
  font-size: 14px;
  font-weight: 300;
  letter-spacing: 0.03em;
  line-height: 1.3;
  font-family: 'Cormorant Garamond', Georgia, serif;
  transition: color 0.22s ease;
}

.contact-link:hover,
.contact-link:active { color: #C9A96E; }

.icon {
  width: 17px;
  height: 17px;
  flex-shrink: 0;
  color: rgba(201, 169, 110, 0.95);
  transition: color 0.22s ease;
}

.contact-link:hover .icon,
.contact-link:active .icon { color: #C9A96E; }

/* QR */
.qr-section {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 22px;
  padding: 26px 0;
  border-top: 1px solid rgba(201, 169, 110, 0.12);
  border-bottom: 1px solid rgba(201, 169, 110, 0.12);
  margin-bottom: 28px;
}

.qr-wrap {
  background: #EDE6D6;
  padding: 9px;
  line-height: 0;
  flex-shrink: 0;
}

.qr-wrap img {
  display: block;
  width: 86px;
  height: 86px;
}

.qr-text {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.qr-label {
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: #C9A96E;
}

.qr-desc {
  font-size: 14px;
  font-weight: 300;
  font-style: italic;
  color: rgba(255, 255, 255, 0.82);
  line-height: 1.4;
}

/* Save */
.save-btn {
  display: block;
  width: 100%;
  padding: 15px 24px;
  background: transparent;
  border: 1px solid rgba(201, 169, 110, 0.42);
  color: #C9A96E;
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 11.5px;
  font-weight: 400;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.22s ease;
}

.save-btn:hover,
.save-btn:active {
  background: #C9A96E;
  color: #565656;
  border-color: #C9A96E;
}
</style>
</head>
