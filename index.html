<style>
:root{
  --bone:#F3EEE6;
  --ink:#211E1A;
  --clay:#C15C3C;
  --pine:#244B44;
  --sand:#DAD3CA;
  --stone:#8C8073;
  /* Clay lifted for use on pine. Same hue, raised luminance so it clears 3:1. */
  --clay-on-pine:#E08A5F;

  --bg:var(--pine);
  --fg:var(--bone);
  --muted:rgba(243,238,230,.62);
  --line:rgba(243,238,230,.20);
  --mark:var(--clay-on-pine);
  --panel:var(--bone);
  --panel-line:var(--bone);
  --qr:var(--ink);
  --btn-fg:var(--bone);
  --btn-hover-fg:var(--pine);

  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;

  /* Sizing scale: tall screens (iPhone 14/15/16 and up) */
  --pad-x:40px;
  --pad-top:42px;
  --pad-bot:34px;
  --mono:70px;
  --name:30px;
  --tag:17px;
  --role:10.5px;
  --body:14px;
  --tag-width:19ch;
  --qr-size:204px;
  --qr-pad:20px;
  --gap-rule-top:20px;
  --gap-rule-bot:20px;
  --gap-divider:26px;
  --gap-contacts:19px;
  --gap-qr:26px;
  --gap-share:24px;
}

/* Medium-height screens (iPhone 12/13 mini, older 8 Plus, small laptops) */
@media (max-height:840px){
  :root{
    --pad-top:26px; --pad-bot:22px;
    --mono:56px; --name:27px; --tag:16px;
    --qr-size:186px; --qr-pad:16px;
    --gap-rule-top:15px; --gap-rule-bot:14px;
    --gap-divider:19px; --gap-contacts:15px;
    --gap-qr:18px; --gap-share:17px;
  }
}

/* Short screens (iPhone SE, browser chrome eating height) */
@media (max-height:700px){
  :root{
    --pad-top:20px; --pad-bot:18px;
    --mono:50px; --name:24px; --tag:14.5px; --body:13.5px;
    --qr-size:158px; --qr-pad:12px;
    --gap-rule-top:12px; --gap-rule-bot:13px;
    --gap-divider:16px; --gap-contacts:12px;
    --gap-qr:14px; --gap-share:15px;
  }
}

/* Narrow screens */
@media (max-width:360px){
  :root{ --pad-x:28px; }
}

/* Installed to the home screen: full screen, so the status bar and home
   indicator eat space at both ends. Trim spacing to compensate. */
@media (display-mode:standalone){
  :root{
    --pad-top:4px; --pad-bot:4px;
    --mono:64px;
    --gap-rule-top:16px; --gap-rule-bot:16px;
    --gap-divider:20px; --gap-qr:20px; --gap-share:18px;
  }
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

html{background:var(--bg)}

body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  display:flex;
  justify-content:center;
  min-height:100vh;
  min-height:100dvh;
}

.card{
  width:100%;
  max-width:430px;
  min-height:100vh;
  min-height:100dvh;
  padding:calc(var(--pad-top) + env(safe-area-inset-top))
          var(--pad-x)
          calc(var(--pad-bot) + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:0;
}

/* ---------- Wordmark block ---------- */
.monogram{
  font-family:var(--serif);
  font-weight:600;
  font-size:var(--mono);
  line-height:.9;
  letter-spacing:.03em;
  color:var(--mark);
  font-variation-settings:'SOFT' 0,'WONK' 0;
}

.mark-rule{
  width:38px;
  height:1px;
  background:var(--clay-on-pine);
  margin:var(--gap-rule-top) 0 var(--gap-rule-bot);
}

.name{
  font-family:var(--serif);
  font-weight:600;
  font-size:var(--name);
  line-height:1.1;
  letter-spacing:.005em;
  color:var(--fg);
  text-align:center;
}

.role{
  margin-top:12px;
  font-family:var(--sans);
  font-weight:500;
  font-size:var(--role);
  letter-spacing:.26em;
  text-transform:uppercase;
  color:var(--muted);
}

.tagline{
  margin-top:calc(var(--gap-rule-top) * .7);
  font-family:var(--serif);
  font-style:italic;
  font-weight:400;
  font-size:var(--tag);
  line-height:1.5;
  letter-spacing:.005em;
  color:var(--fg);
  text-align:center;
  max-width:var(--tag-width);
}

/* ---------- Divider ---------- */
.divider{
  width:100%;
  height:1px;
  background:var(--line);
  margin:var(--gap-divider) 0;
}

/* ---------- Contacts ---------- */
.contacts{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:var(--gap-contacts);
}

.contact{
  display:flex;
  align-items:center;
  gap:14px;
  text-decoration:none;
  color:var(--fg);
  font-family:var(--sans);
  font-weight:400;
  font-size:var(--body);
  letter-spacing:.005em;
  line-height:1.3;
  transition:color .2s ease;
}
.contact:hover,.contact:active{color:var(--clay)}

.icon{
  width:16px;height:16px;
  flex-shrink:0;
  color:var(--muted);
  transition:color .2s ease;
}
.contact:hover .icon,.contact:active .icon{color:var(--clay)}

/* ---------- QR ---------- */
.qr-block{
  margin-top:var(--gap-qr);
  display:flex;
  flex-direction:column;
  align-items:center;
}

.qr-panel{
  background:var(--panel);
  border:1px solid var(--panel-line);
  padding:var(--qr-pad);
  line-height:0;
}

.qr-panel svg{
  display:block;
  width:min(var(--qr-size), calc(100vw - 2*var(--pad-x) - 2*var(--qr-pad) - 4px));
  height:auto;
  aspect-ratio:1/1;
  color:var(--qr);
  shape-rendering:crispEdges;
}

.qr-label{
  margin-top:14px;
  font-family:var(--sans);
  font-weight:400;
  font-size:9.5px;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--muted);
}

/* ---------- Share ---------- */
.share{
  margin-top:var(--gap-share);
  width:100%;
  padding:15px 20px;
  background:transparent;
  border:1px solid var(--btn-fg);
  color:var(--btn-fg);
  font-family:var(--sans);
  font-weight:500;
  font-size:var(--role);
  letter-spacing:.26em;
  text-transform:uppercase;
  text-align:center;
  text-decoration:none;
  cursor:pointer;
  transition:background-color .2s ease,color .2s ease;
  -webkit-appearance:none;
  appearance:none;
}
.share:hover,.share:active{
  background:var(--btn-fg);
  color:var(--btn-hover-fg);
}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}

/* ---- No-monogram layout: the name is the hero, the QR takes the space back ---- */
:root{ --name:34px; --qr-size:240px; }
@media (max-height:840px){ :root{ --name:30px; --qr-size:210px; } }
@media (max-height:700px){ :root{ --name:26px; --qr-size:176px; } }
@media (display-mode:standalone){ :root{ --qr-size:228px; } }
.mark-rule{
  width:34px;
  background:var(--clay-on-pine);
  margin:0 0 var(--gap-rule-bot);
}

/* ---- Role line in clay: it becomes the single clay moment ---- */
.role{
  color:var(--clay-on-pine);
  font-size:11px;
  font-weight:600;
}
.mark-rule{ background:var(--line); }
</style>

(function(){
  var VCARD = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "N:Klishevich;Nina;;;",
    "FN:Nina Klishevich",
    "TITLE:Executive Advisor",
    "EMAIL;TYPE=INTERNET:nina.klishevich@gmail.com",
    "TEL;TYPE=CELL:+971565251727",
    "URL:https://www.linkedin.com/in/nina-klishevich",
    "END:VCARD"
  ].join("\r\n") + "\r\n";

  var FILENAME = "nina-klishevich.vcf";

  function download(){
    var blob = new Blob([VCARD], {type:"text/vcard;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = FILENAME;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  document.getElementById("share").addEventListener("click", function(){
    var file;
    try {
      file = new File([VCARD], FILENAME, {type:"text/vcard"});
    } catch(e) { file = null; }

    if (file && navigator.canShare && navigator.canShare({files:[file]})) {
      navigator.share({files:[file], title:"Nina Klishevich"}).catch(function(){});
      return;
    }
    download();
  });
})();
